providers:
  deepseek:
    quirks:
      disable_named_tool_choice_when_reasoning: true
      omit_tool_choice_when_reasoning: true
      preserve_reasoning_content: true
      require_assistant_content: true

families:
  deepseek_v4:
    provider: deepseek
    model_prefix: deepseek-v4-
    capabilities:
      reasoning: "yes"

models:
  deepseek/deepseek-v4-flash-vision-exp:
    capabilities:
      tools: "yes"
      vision: "yes"
      reasoning: "yes"
      streaming_tools: "yes"
      reasoning_tools: "yes"
      tool_choice_auto: "yes"
      vision_tools: "yes"
