[project]
name = "openvideo-api"
version = "0.1.0"
description = "OpenVideo 本地下载与播放 API"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
  "yt-dlp>=2025.3.31",
  "faster-whisper>=1.1,<2",
  "huggingface-hub>=0.34,<2",
  "platformdirs>=4.11,<5",
  "portalocker>=4.1,<5",
  "keyring>=25.7,<26",
  "litellm>=1.98,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "qwen-asr==0.0.6",
  "funasr==1.3.29",
  "torch==2.11.0",
  "torchaudio==2.11.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["smoke: 需要本地模型和音频样本的真实推理测试"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openvideo"]
